# HTTP solamente. No anunciar HTTPS hasta instalar y verificar un certificado.
server {
    listen 80 default_server;
    server_name _;
    root /var/www/cafenube;
    index index.html;
    autoindex off;
    server_tokens off;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location / { try_files $uri $uri/ =404; }
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "cafenube-ok\n";
    }
    location ~ /\. { deny all; }
}
