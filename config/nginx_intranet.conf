server_tokens off;
server {
    listen 10.0.0.133:80 default_server;
    server_name rrhh.cafenube.internal intranet.cafenube.internal;
    root /var/www/cafenube-intranet;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "cafenube-intranet-ok\n";
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
